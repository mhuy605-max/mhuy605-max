<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="indiedev.css contribution signal console">
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0"/>
      <rect y="2" width="4" height="2" fill="#000" opacity=".23"/>
    </pattern>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="520" fill="#030303"/>
  <rect x="18" y="18" width="1164" height="484" rx="10" fill="#070707" stroke="#e8e8e8" stroke-width="2"/>

  <!-- top bar -->
  <text x="42" y="52" fill="#f2f2f2" font-family="monospace" font-size="20" letter-spacing="3">// CONTRIBUTION_SIGNAL.exe</text>
  <text x="1030" y="52" fill="#666" font-family="monospace" font-size="12">LOCAL://GITHUB</text>
  <line x1="38" y1="70" x2="1162" y2="70" stroke="#444"/>

  <!-- left console -->
  <rect x="38" y="92" width="390" height="312" fill="#050505" stroke="#555"/>
  <text x="62" y="128" fill="#fff" font-family="monospace" font-size="17">&gt; SIGNAL STATUS</text>
  <line x1="58" y1="145" x2="408" y2="145" stroke="#2c2c2c"/>
  <text x="62" y="184" fill="#888" font-family="monospace" font-size="14">repository feed</text>
  <text x="300" y="184" fill="#fff" font-family="monospace" font-size="14">ONLINE</text>
  <text x="62" y="218" fill="#888" font-family="monospace" font-size="14">build mode</text>
  <text x="300" y="218" fill="#fff" font-family="monospace" font-size="14">INDIE</text>
  <text x="62" y="252" fill="#888" font-family="monospace" font-size="14">stack state</text>
  <text x="300" y="252" fill="#fff" font-family="monospace" font-size="14">ACTIVE</text>
  <text x="62" y="286" fill="#888" font-family="monospace" font-size="14">safe mode</text>
  <text x="300" y="286" fill="#fff" font-family="monospace" font-size="14">DISABLED</text>
  <text x="62" y="336" fill="#5f5f5f" font-family="monospace" font-size="12">root@indiedev:~$ keep-building</text>
  <rect x="326" y="323" width="9" height="16" fill="#fff"><animate attributeName="opacity" values="1;1;0;0;1" dur="1s" repeatCount="indefinite"/></rect>

  <!-- center radar -->
  <rect x="446" y="92" width="314" height="312" fill="#050505" stroke="#555"/>
  <text x="470" y="128" fill="#fff" font-family="monospace" font-size="17">&gt; BUILD RADAR</text>
  <line x1="466" y1="145" x2="740" y2="145" stroke="#2c2c2c"/>
  <g transform="translate(603 252)" fill="none" stroke="#777">
    <circle r="86"/><circle r="58"/><circle r="29"/>
    <line x1="-96" y1="0" x2="96" y2="0"/><line x1="0" y1="-96" x2="0" y2="96"/>
    <path d="M0 0 L72 -34" stroke="#fff" stroke-width="2" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>
  <circle cx="646" cy="220" r="4" fill="#fff"><animate attributeName="opacity" values=".2;1;.2" dur="1.3s" repeatCount="indefinite"/></circle>
  <circle cx="570" cy="286" r="3" fill="#aaa"><animate attributeName="opacity" values="1;.2;1" dur="1.7s" repeatCount="indefinite"/></circle>
  <text x="486" y="383" fill="#666" font-family="monospace" font-size="12">tracking commits / ideas / experiments</text>

  <!-- right city -->
  <rect x="778" y="92" width="384" height="312" fill="#050505" stroke="#555"/>
  <text x="802" y="128" fill="#fff" font-family="monospace" font-size="17">&gt; NIGHT SHIFT</text>
  <line x1="798" y1="145" x2="1142" y2="145" stroke="#2c2c2c"/>
  <circle cx="1090" cy="198" r="38" fill="none" stroke="#d6d6d6" stroke-width="2" filter="url(#glow)"/>
  <path d="M1038 199h103M1048 190h82M1055 210h72" stroke="#555" opacity=".6">
    <animate attributeName="transform" values="translate(0 0);translate(6 0);translate(-4 0);translate(0 0)" dur="3.2s" repeatCount="indefinite"/>
  </path>
  <g fill="#111" stroke="#444">
    <path d="M802 362v-72h34v72zm38 0v-104h42v104zm46 0v-62h31v62zm35 0v-132h53v132zm57 0v-92h37v92zm41 0v-116h49v116zm53 0v-76h29v76zm33 0v-98h43v98z"/>
  </g>
  <g fill="#ccc">
    <rect x="850" y="282" width="5" height="5"/><rect x="871" y="309" width="5" height="5"/><rect x="940" y="255" width="5" height="5"/><rect x="959" y="292" width="5" height="5"/><rect x="1037" y="267" width="5" height="5"/><rect x="1121" y="286" width="5" height="5"/>
    <animate attributeName="opacity" values=".2;1;.35;.8;.2" dur="2.7s" repeatCount="indefinite"/>
  </g>
  <text x="808" y="383" fill="#666" font-family="monospace" font-size="12">coded at night // shipped in daylight</text>

  <!-- footer motto -->
  <rect x="38" y="424" width="1124" height="56" fill="#080808" stroke="#555"/>
  <text x="600" y="459" text-anchor="middle" fill="#fff" font-family="monospace" font-size="25" letter-spacing="5" filter="url(#glow)">NO SAFE MODE // KEEP BUILDING</text>
  <rect x="38" y="18" width="1164" height="484" fill="url(#scan)" opacity=".36"/>
</svg>